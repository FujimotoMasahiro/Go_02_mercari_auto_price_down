<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>売れ筋リサーチ — メルカリ自動値引きツール</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --surface2: #22263a;
      --border:   #2e3250;
      --accent:   #ff6b35;
      --green:    #22c55e;
      --yellow:   #f59e0b;
      --red:      #ef4444;
      --blue:     #60a5fa;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --console:  #0a0c14;
      --radius:   12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
                   "Noto Sans JP", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 80px;
    }

    /* ── Header ─────────────────────────────── */
    header {
      width: 100%; max-width: 1100px;
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 36px;
    }
    .logo {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; flex-shrink: 0;
    }
    header h1 { font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
    header p  { font-size: 13px; color: var(--muted); margin-top: 3px; }
    /* ── Controls ─────────────────────────── */
    .controls-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%; max-width: 1100px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 16px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .control-label {
      font-size: 11px; font-weight: 700;
      color: var(--muted); text-transform: uppercase;
      letter-spacing: .08em;
    }
    select, input[type="number"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      padding: 9px 12px;
      outline: none;
      transition: border-color .15s;
      min-width: 200px;
    }
    select:focus, input[type="number"]:focus {
      border-color: var(--blue);
    }
    input[type="number"] { min-width: 80px; width: 80px; }

    .run-btn {
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px; font-weight: 700;
      padding: 10px 24px;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      white-space: nowrap;
    }
    .run-btn:hover { opacity: .9; }
    .run-btn:active { transform: scale(.98); }
    .run-btn:disabled { opacity: .45; cursor: not-allowed; }

    .stop-btn {
      background: none;
      border: 1px solid var(--red);
      border-radius: 8px;
      color: var(--red);
      font-size: 14px; font-weight: 700;
      padding: 10px 18px;
      cursor: pointer;
      transition: background .15s;
      display: none;
    }
    .stop-btn:hover { background: rgba(239,68,68,.1); }

    /* ── Status bar ──────────────────────── */
    .status-bar {
      width: 100%; max-width: 1100px;
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 16px;
      font-size: 13px;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted); flex-shrink: 0;
    }
    .status-dot.running { background: var(--green); animation: pulse 1s infinite; }
    .status-dot.done    { background: var(--blue); }
    .status-dot.error   { background: var(--red); }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .4; }
    }
    .status-text { color: var(--muted); }

    /* ── Console ─────────────────────────── */
    .console-wrap {
      width: 100%; max-width: 1100px;
      margin-bottom: 24px;
    }
    .console-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px;
    }
    .console-label {
      font-size: 11px; font-weight: 700;
      color: var(--muted); text-transform: uppercase; letter-spacing: .08em;
    }
    .ghost-btn {
      font-size: 12px; color: var(--muted); background: none;
      border: 1px solid var(--border); border-radius: 6px;
      padding: 4px 10px; cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    .ghost-btn:hover { color: var(--text); border-color: var(--muted); }
    #console {
      background: var(--console);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      height: 180px;
      overflow-y: auto;
      font-family: "SF Mono","Fira Code","Menlo",monospace;
      font-size: 12px; line-height: 1.65;
      white-space: pre-wrap; word-break: break-all;
      color: #718096;
    }
    #console::-webkit-scrollbar { width: 5px; }
    #console::-webkit-scrollbar-track { background: transparent; }
    #console::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Results ─────────────────────────── */
    .results-header {
      width: 100%; max-width: 1100px;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .section-label {
      font-size: 11px; font-weight: 700;
      color: var(--muted); text-transform: uppercase; letter-spacing: .09em;
    }
    .results-meta {
      font-size: 12px; color: var(--muted);
    }
    .results-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%; max-width: 1100px;
      overflow: hidden;
    }

    /* ── Table ───────────────────────────── */
    .tbl-wrap {
      overflow-x: auto;
    }
    table {
      width: 100%; border-collapse: collapse;
      font-size: 13px;
    }
    thead th {
      background: var(--surface2);
      padding: 10px 14px;
      text-align: left;
      font-size: 11px; font-weight: 700;
      color: var(--muted); text-transform: uppercase; letter-spacing: .06em;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0;
    }
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }
    tbody td {
      padding: 10px 14px;
      vertical-align: middle;
    }
    .td-rank { text-align: center; width: 40px; color: var(--muted); font-size: 12px; }
    .td-thumb { width: 64px; padding: 6px 10px; }
    .thumb {
      width: 52px; height: 52px;
      object-fit: cover; border-radius: 7px; display: block;
      background: var(--surface2);
    }
    .no-thumb {
      width: 52px; height: 52px;
      background: var(--surface2); border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: var(--muted);
    }
    .td-name {
      max-width: 400px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .td-price {
      text-align: right; white-space: nowrap;
      font-weight: 600;
      color: var(--yellow);
    }
    .td-page {
      text-align: center;
      font-size: 11px; color: var(--muted);
    }
    .item-link {
      color: var(--blue);
      text-decoration: none;
      font-size: 11px;
      white-space: nowrap;
    }
    .item-link:hover { text-decoration: underline; }

    /* ── Empty / Loading ─────────────────── */
    .placeholder {
      padding: 56px 24px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
    .placeholder .ph-icon { font-size: 40px; display: block; margin-bottom: 12px; opacity: .4; }

    /* ── Pagination ──────────────────────── */
    .pagination {
      display: flex; align-items: center; justify-content: center;
      gap: 8px;
      padding: 16px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .page-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      padding: 5px 10px;
      cursor: pointer;
      transition: border-color .12s, background .12s;
    }
    .page-btn:hover { border-color: var(--blue); }
    .page-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 700; }
    .page-info { font-size: 12px; color: var(--muted); }

    footer { margin-top: 16px; font-size: 12px; color: var(--muted); text-align: center; }

    /* ── Progress widget ────────────────────────────── */
    .progress-widget {
      margin-bottom: 12px; padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border); border-radius: 10px;
    }
    .progress-bar-track {
      width: 100%; height: 7px;
      background: var(--surface2); border-radius: 999px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; border-radius: 999px;
      background: linear-gradient(90deg, #0ea5e9, #2563eb);
      width: 0%;
      transition: width .65s cubic-bezier(.4,0,.2,1);
    }
    .progress-bar-fill.is-done  { background: linear-gradient(90deg, #059669, #22c55e); }
    .progress-bar-fill.is-error { background: #ef4444; width: 100% !important; }
    .progress-info-row {
      display: flex; align-items: center; gap: 10px;
      margin-top: 8px;
    }
    .progress-step-lbl {
      font-size: 12px; color: var(--muted); flex: 1;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .progress-pct-lbl {
      font-size: 12px; font-weight: 700;
      font-family: "SF Mono","Menlo",monospace;
      color: #38bdf8; flex-shrink: 0; transition: color .3s;
    }
    .progress-pct-lbl.is-done  { color: #22c55e; }
    .progress-pct-lbl.is-error { color: #ef4444; }
    .progress-count-row {
      margin-top: 5px;
      font-size: 11px; font-weight: 700;
      font-family: "SF Mono","Menlo",monospace;
      color: var(--yellow); letter-spacing: .02em;
    }

    /* ── Nav Drawer ──────────────────────────────────── */
    .ham-btn {
      position: fixed; top: 16px; right: 16px; z-index: 1000;
      width: 42px; height: 42px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 5px;
      transition: border-color .15s, background .15s;
    }
    .ham-btn:hover { border-color: var(--accent); background: var(--surface); }
    .ham-line {
      width: 18px; height: 2px;
      background: var(--text); border-radius: 2px;
      transition: transform .25s ease, opacity .2s ease;
    }
    .ham-btn.is-open .ham-line:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .ham-btn.is-open .ham-line:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .ham-btn.is-open .ham-line:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .nav-backdrop {
      position: fixed; inset: 0; z-index: 900;
      background: rgba(0,0,0,.55); backdrop-filter: blur(3px);
      opacity: 0; pointer-events: none; transition: opacity .25s ease;
    }
    .nav-backdrop.is-open { opacity: 1; pointer-events: all; }
    .nav-drawer {
      position: fixed; top: 0; right: -270px; bottom: 0; z-index: 950;
      width: 260px; background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column; padding-top: 16px;
      transition: right .28s cubic-bezier(.4,0,.2,1); overflow-y: auto;
    }
    .nav-drawer.is-open { right: 0; }
    .nav-drawer-head {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 18px 18px; border-bottom: 1px solid var(--border);
    }
    .nav-drawer-logo {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--accent), #ff3c7a);
      border-radius: 8px; display: flex; align-items: center;
      justify-content: center; font-size: 17px; flex-shrink: 0;
    }
    .nav-drawer-title { font-size: 13px; font-weight: 700; color: var(--text); }
    .nav-drawer-sub   { font-size: 11px; color: var(--muted); }
    .nav-links { padding: 10px 0; flex: 1; }
    .nav-link {
      display: flex; align-items: center; gap: 11px;
      padding: 11px 18px; text-decoration: none; color: var(--muted);
      font-size: 14px; font-weight: 500;
      border-left: 3px solid transparent;
      transition: color .15s, background .15s, border-color .15s;
    }
    .nav-link:hover { color: var(--text); background: var(--surface2); }
    .nav-link.is-active {
      color: var(--text); background: rgba(255,107,53,.08);
      border-left-color: var(--accent); font-weight: 600;
    }
    .nav-link-icon { font-size: 17px; flex-shrink: 0; width: 22px; text-align: center; }
    .nav-sep { height: 1px; background: var(--border); margin: 8px 18px; }

    /* ── Sold-in badge ───────────────────────────── */
    .sold-in {
      display: inline-block;
      padding: 3px 9px; border-radius: 999px;
      font-size: 11px; font-weight: 700; white-space: nowrap;
    }
    .sold-in-min  { background: rgba(34,197,94,.15);  color: #22c55e; border: 1px solid rgba(34,197,94,.35); }
    .sold-in-hour { background: rgba(245,158,11,.15); color: #f59e0b; border: 1px solid rgba(245,158,11,.35); }
    .sold-in-day-fast { background: rgba(251,146,60,.15); color: #fb923c; border: 1px solid rgba(251,146,60,.35); }
    .sold-in-day  { background: rgba(100,116,139,.1); color: var(--muted); border: 1px solid rgba(100,116,139,.2); }
    .sold-in-none { color: var(--muted); font-size: 13px; }
    .td-soldin { white-space: nowrap; }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">🔍</div>
  <div>
    <h1>売れ筋リサーチ</h1>
    <p>カテゴリー別の売り切れ商品を調査して売上・利益を最大化</p>
  </div>
</header>

<!-- Controls -->
<div class="controls-card">
  <div class="control-group">
    <span class="control-label">カテゴリー</span>
    <select id="categorySelect">
      <option value="">すべて</option>
      <option value="5">レディース</option>
      <option value="6">メンズ</option>
      <option value="7">ベビー・キッズ</option>
      <option value="8">インテリア・住まい・小物</option>
      <option value="9">本・音楽・ゲーム</option>
      <option value="10">おもちゃ・ホビー・グッズ</option>
      <option value="11">コスメ・香水・美容</option>
      <option value="12">家電・スマホ・カメラ</option>
      <option value="13">スポーツ・レジャー</option>
      <option value="14">ハンドメイド</option>
      <option value="15">チケット</option>
      <option value="16">自動車・オートバイ</option>
      <option value="17">その他</option>
    </select>
  </div>
  <div class="control-group">
    <span class="control-label">ページ数</span>
    <input type="number" id="pagesInput" value="5" min="1" max="10">
  </div>
  <button class="run-btn" id="runBtn" onclick="runResearch()">▶ リサーチ開始</button>
  <button class="stop-btn" id="stopBtn" onclick="stopResearch()">■ 停止</button>
  <button class="ghost-btn" onclick="loadResults()" style="margin-left:auto">最新結果を表示</button>
</div>

<!-- Status -->
<div class="status-bar">
  <div class="status-dot" id="statusDot"></div>
  <span class="status-text" id="statusText">待機中</span>
</div>

<!-- Console -->
<div class="console-wrap">
  <div class="console-header">
    <span class="console-label">実行ログ</span>
    <button class="ghost-btn" onclick="document.getElementById('console').textContent=''">クリア</button>
  </div>
  <!-- プログレスバー (実行中のみ表示) -->
  <div class="progress-widget" id="progressWidget" style="display:none">
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    <div class="progress-info-row">
      <span class="progress-step-lbl" id="progressStep">準備中…</span>
      <span class="progress-pct-lbl"  id="progressPct">0%</span>
    </div>
    <div class="progress-count-row" id="progressCount" style="display:none"></div>
  </div>
  <div id="console"></div>
</div>

<!-- Results -->
<div class="results-header">
  <span class="section-label">リサーチ結果</span>
  <span class="results-meta" id="resultsMeta"></span>
</div>
<div class="results-card">
  <div class="tbl-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>画像</th>
          <th>商品名</th>
          <th>価格</th>
          <th>売れた時間</th>
          <th>リンク</th>
        </tr>
      </thead>
      <tbody id="resultsTbody">
        <tr><td colspan="6">
          <div class="placeholder">
            <span class="ph-icon">🔍</span>
            カテゴリーを選択して「リサーチ開始」を押してください
          </div>
        </td></tr>
      </tbody>
    </table>
  </div>
</div>

<footer>Mercari Auto Price Down Tool — 売れ筋リサーチ</footer>

<script>
  const consoleEl   = document.getElementById('console');
  const statusDot   = document.getElementById('statusDot');
  const statusText  = document.getElementById('statusText');
  const runBtn      = document.getElementById('runBtn');
  const stopBtn     = document.getElementById('stopBtn');
  const resultsMeta = document.getElementById('resultsMeta');

  let allItems = [];
  let eventSource = null;

  // ── 進捗管理 ─────────────────────────────────────────────
  let totalPages = 0;
  let totalDetail = 0;

  function resetProgress() {
    document.getElementById('progressFill').style.width = '0%';
    document.getElementById('progressFill').className   = 'progress-bar-fill';
    document.getElementById('progressStep').textContent = '準備中…';
    const pctEl = document.getElementById('progressPct');
    pctEl.textContent = '0%';
    pctEl.className   = 'progress-pct-lbl';
    document.getElementById('progressCount').style.display = 'none';
    document.getElementById('progressWidget').style.display = 'block';
    totalPages = 0;
  }

  function setProgressBar(pct, stepText, countText) {
    const fill  = document.getElementById('progressFill');
    const step  = document.getElementById('progressStep');
    const pctEl = document.getElementById('progressPct');
    const count = document.getElementById('progressCount');
    const p = Math.max(0, Math.min(100, pct));
    fill.style.width  = p + '%';
    step.textContent  = stepText;
    pctEl.textContent = p + '%';
    if (pct >= 100) {
      fill.classList.add('is-done');
      pctEl.classList.add('is-done');
    } else if (pct < 0) {
      fill.classList.add('is-error');
      pctEl.classList.add('is-error');
      pctEl.textContent = '—';
    }
    if (typeof countText === 'string') {
      count.style.display = 'block';
      count.textContent   = countText;
    } else if (countText === null) {
      count.style.display = 'none';
    }
  }

  // ログ1行からリサーチの進捗情報を解析
  function parseProgress(line) {
    if (/Chrome起動 → 開始|Chrome接続確認/.test(line))
      return { pct: 5,  step: 'Chrome 起動中…' };
    if (line.includes('Chromeプロセス開始'))
      return { pct: 8,  step: 'Chrome プロセス起動完了' };
    if (line.includes('Chrome DevTools接続準備') && line.includes('完了'))
      return { pct: 12, step: 'DevTools 接続完了' };
    if (line.includes('タブID取得') && !line.includes('見つかりません'))
      return { pct: 15, step: 'ブラウザタブ 接続完了' };
    if (line.includes('メルカリTOP') && line.includes('200 OK'))
      return { pct: 22, step: 'メルカリ TOP 読み込み完了' };

    // ページ N/M スクレイピング開始（22〜55%）
    const startM = line.match(/ページ (\d+)\/(\d+)/);
    if (startM) {
      const cur   = parseInt(startM[1]);
      const total = parseInt(startM[2]);
      if (total > 0) totalPages = total;
      const pct = 22 + Math.round((cur - 1) / (totalPages || 1) * 33);
      return {
        pct,
        step:  `ページ ${cur} / ${totalPages} スクレイピング中`,
        count: `▶ ${cur} / ${totalPages} ページ処理中`
      };
    }

    // ページ N 取得完了
    const doneM = line.match(/ページ (\d+) 取得完了 → (\d+)件/);
    if (doneM) {
      const cur   = parseInt(doneM[1]);
      const total = totalPages || cur;
      const pct   = 22 + Math.round(cur / total * 33);
      return {
        pct,
        step:  `ページ ${cur} 完了 (${doneM[2]}件取得)`,
        count: `▶ ${cur} / ${total} ページ完了`
      };
    }

    // 詳細取得フェーズ（55〜88%）
    if (line.includes('詳細取得') && line.includes('開始')) {
      const m = line.match(/(\d+)件/);
      if (m) totalDetail = parseInt(m[1]);
      return { pct: 55, step: `商品詳細確認 開始 (${totalDetail || '?'}件)`, count: `▶ 0 / ${totalDetail || '?'} 件確認中` };
    }
    const detailM = line.match(/詳細取得.*?\((\d+)\/(\d+)\)/);
    if (detailM) {
      const cur   = parseInt(detailM[1]);
      const total = parseInt(detailM[2]);
      if (total > 0) totalDetail = total;
      const pct = 55 + Math.round(cur / (totalDetail || 1) * 33);
      return {
        pct,
        step:  `商品詳細確認中 (${cur} / ${totalDetail})`,
        count: `▶ ${cur} / ${totalDetail} 件確認中`
      };
    }
    if (line.includes('詳細取得') && line.includes('完了'))
      return { pct: 88, step: '商品詳細確認 完了', count: null };

    if (line.includes('CSV保存完了'))
      return { pct: 93, step: 'CSV ファイル保存完了', count: null };
    if (line.includes('リサーチ完了') || line.includes('全処理完了') || line.includes('[終了] 正常終了'))
      return { pct: 100, step: 'リサーチ完了', count: null };
    if (/\[終了\] エラー/.test(line))
      return { pct: -1, step: 'エラーが発生しました', count: null };

    return null;
  }

  // ── State ────────────────────────────────────────────────
  function setRunning(running) {
    runBtn.disabled  = running;
    stopBtn.style.display = running ? 'inline-block' : 'none';
    statusDot.className  = 'status-dot' + (running ? ' running' : '');
    statusText.textContent = running ? 'リサーチ実行中...' : '待機中';
  }

  function setDone(ok) {
    statusDot.className = 'status-dot ' + (ok ? 'done' : 'error');
    statusText.textContent = ok ? '完了' : 'エラー';
    runBtn.disabled = false;
    stopBtn.style.display = 'none';
    setProgressBar(ok ? 100 : -1,
      ok ? 'リサーチ完了' : 'エラーが発生しました', null);
  }

  // ── Console ──────────────────────────────────────────────
  function log(msg) {
    // プログレスバー更新
    const prog = parseProgress(msg);
    if (prog) setProgressBar(prog.pct, prog.step, prog.count);

    // ログ表示
    const line = document.createElement('div');
    line.textContent = msg;
    if (msg.startsWith('[終了]')) line.style.color = '#22c55e';
    if (msg.startsWith('ERROR') || msg.includes('失敗')) line.style.color = '#ef4444';
    consoleEl.appendChild(line);
    consoleEl.scrollTop = consoleEl.scrollHeight;
  }

  // ── Run / Stop ───────────────────────────────────────────
  async function runResearch() {
    const categoryId   = document.getElementById('categorySelect').value;
    const categoryName = document.getElementById('categorySelect').selectedOptions[0].text;
    const pages        = parseInt(document.getElementById('pagesInput').value) || 5;

    consoleEl.textContent = '';
    resetProgress();
    setRunning(true);

    if (eventSource) { eventSource.close(); eventSource = null; }
    eventSource = new EventSource('/events');
    eventSource.onmessage = e => {
      if (e.data === '__DONE__') {
        eventSource.close(); eventSource = null;
        setDone(true);
        setTimeout(loadResults, 500);
        return;
      }
      log(e.data);
    };
    eventSource.onerror = () => { setDone(false); };

    try {
      const res = await fetch('/run-research', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ categoryId, categoryName, pages }),
      });
      const data = await res.json();
      if (data.error) {
        log('ERROR: ' + data.error);
        setDone(false);
        if (eventSource) { eventSource.close(); eventSource = null; }
      }
    } catch (err) {
      log('ERROR: ' + err.message);
      setDone(false);
    }
  }

  async function stopResearch() {
    await fetch('/stop', { method: 'POST' });
  }

  // ── Load results ─────────────────────────────────────────
  async function loadResults() {
    try {
      const res  = await fetch('/research-data');
      const data = await res.json();
      allItems = data.items || [];
      const fname = data.file || '';
      if (allItems.length === 0) {
        resultsMeta.textContent = '';
        renderTable([]);
        return;
      }
      resultsMeta.textContent = `${fname}  /  ${allItems.length}件`;
      renderTable(allItems);
    } catch (err) {
      resultsMeta.textContent = 'エラー: ' + err.message;
    }
  }

  // 売れた時間バッジを返します。
  // 分 → 緑、時間 → 黄、3日以内 → オレンジ、それ以上 → グレー
  function soldInBadge(soldIn) {
    if (!soldIn) return '<span class="sold-in-none">—</span>';
    const cls = soldIn.includes('分')   ? 'sold-in-min'  :
                soldIn.includes('時間') ? 'sold-in-hour' :
                (soldIn.includes('日') && parseInt(soldIn) <= 3) ? 'sold-in-day-fast' :
                'sold-in-day';
    return `<span class="sold-in ${cls}">${escHtml(soldIn)}</span>`;
  }

  function renderTable(items) {
    const tbody = document.getElementById('resultsTbody');
    if (!items.length) {
      tbody.innerHTML = `<tr><td colspan="6">
        <div class="placeholder">
          <span class="ph-icon">📭</span>
          結果がありません。リサーチを実行してください。
        </div>
      </td></tr>`;
      return;
    }
    tbody.innerHTML = items.map((item, i) => {
      const price = item.price > 0 ? `¥${item.price.toLocaleString()}` : '—';
      const url   = `https://jp.mercari.com/item/${escHtml(item.id)}`;
      const thumb = item.imagePath
        ? `<img class="thumb" src="${escHtml(item.imagePath)}" alt="${escHtml(item.name)}" loading="lazy">`
        : `<div class="no-thumb">🛍️</div>`;
      return `<tr>
        <td class="td-rank">${i + 1}</td>
        <td class="td-thumb">${thumb}</td>
        <td class="td-name" title="${escHtml(item.name)}">${escHtml(item.name)}</td>
        <td class="td-price">${price}</td>
        <td class="td-soldin">${soldInBadge(item.soldIn)}</td>
        <td><a class="item-link" href="${url}" target="_blank" rel="noopener">開く ↗</a></td>
      </tr>`;
    }).join('');
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Init ──────────────────────────────────────────────────
  loadResults();
</script>

<script>
  (function() {
    const p = location.pathname;
    document.querySelectorAll('.nav-link[data-navpath]').forEach(el => {
      if (el.dataset.navpath === p) el.classList.add('is-active');
    });
  })();
  function navToggle() {
    const open = document.getElementById('navDrawer').classList.toggle('is-open');
    document.getElementById('hamBtn').classList.toggle('is-open', open);
    document.getElementById('navBackdrop').classList.toggle('is-open', open);
    document.getElementById('navDrawer').setAttribute('aria-hidden', !open);
  }
  function navClose() {
    document.getElementById('navDrawer').classList.remove('is-open');
    document.getElementById('hamBtn').classList.remove('is-open');
    document.getElementById('navBackdrop').classList.remove('is-open');
    document.getElementById('navDrawer').setAttribute('aria-hidden', 'true');
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') navClose(); });
</script>
