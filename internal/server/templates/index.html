<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メルカリ自動値引きツール</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --surface2: #22263a;
      --border:   #2e3250;
      --accent:   #ff6b35;
      --green:    #22c55e;
      --yellow:   #f59e0b;
      --red:      #ef4444;
      --blue:     #60a5fa;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --console:  #0a0c14;
      --radius:   12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
                   "Noto Sans JP", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 80px;
    }

    /* ── Header ─────────────────────────────── */
    header {
      width: 100%; max-width: 960px;
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 48px;
    }
    .logo {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, var(--accent), #ff3c7a);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; flex-shrink: 0;
    }
    header h1 { font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
    header p  { font-size: 13px; color: var(--muted); margin-top: 3px; }

    /* ── Section title ────────────────────── */
    .section-label {
      width: 100%; max-width: 960px;
      font-size: 11px; font-weight: 700;
      color: var(--muted); text-transform: uppercase;
      letter-spacing: .09em; margin-bottom: 14px;
    }

    /* ── Menu grid ───────────────────────── */
    .menu-grid {
      width: 100%; max-width: 960px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 48px;
    }

    .menu-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 24px;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color .15s, background .15s, transform .1s;
      cursor: pointer;
    }
    .menu-card:hover {
      border-color: var(--accent);
      background: var(--surface2);
      transform: translateY(-2px);
    }
    .menu-card:active { transform: translateY(0); }

    .menu-card-icon {
      width: 44px; height: 44px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .icon-green  { background: linear-gradient(135deg, #059669, #047857); }
    .icon-blue   { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
    .icon-purple { background: linear-gradient(135deg, #7c3aed, #5b21b6); }

    .menu-card-title {
      font-size: 16px; font-weight: 700;
    }
    .menu-card-desc {
      font-size: 13px; color: var(--muted); line-height: 1.55;
    }
    .menu-card-arrow {
      margin-top: auto;
      font-size: 12px; color: var(--muted);
      display: flex; align-items: center; gap: 4px;
    }

    /* ── Card (log explorer) ──────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%; max-width: 960px;
      margin-bottom: 20px;
    }
    .card-title {
      font-size: 12px; font-weight: 600;
      color: var(--muted); text-transform: uppercase;
      letter-spacing: .08em; margin-bottom: 16px;
    }
    .toolbar {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 12px;
    }
    .ghost-btn {
      font-size: 12px; color: var(--muted); background: none;
      border: 1px solid var(--border); border-radius: 6px;
      padding: 4px 10px; cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    .ghost-btn:hover { color: var(--text); border-color: var(--muted); }

    /* ── Log explorer ────────────────────── */
    .log-layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 14px;
      min-height: 360px;
    }
    @media (max-width: 640px) {
      .log-layout { grid-template-columns: 1fr; }
    }

    .file-tree {
      background: var(--console);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow-y: auto;
      padding: 8px 0;
    }
    .tree-dir {
      padding: 6px 12px 4px;
      font-size: 11px; font-weight: 700;
      color: var(--muted); text-transform: uppercase;
      letter-spacing: .06em;
      display: flex; align-items: center; gap: 6px;
    }
    .tree-dir-icon { opacity: .6; font-size: 13px; }
    .tree-empty {
      padding: 32px 12px;
      font-size: 12px; color: var(--muted); text-align: center;
    }
    .file-item {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 12px 5px 20px;
      font-size: 12px; font-family: "SF Mono","Menlo",monospace;
      color: #718096; cursor: pointer;
      border-left: 2px solid transparent;
      transition: background .12s, color .12s, border-color .12s;
      word-break: break-all;
    }
    .file-item:hover  { background: var(--surface2); color: var(--text); }
    .file-item.active {
      background: var(--surface2);
      color: var(--blue);
      border-left-color: var(--blue);
    }
    .file-icon { font-size: 12px; flex-shrink: 0; }

    .viewer-wrap { display: flex; flex-direction: column; gap: 8px; }
    .viewer-header { display: flex; align-items: center; gap: 10px; }
    .viewer-filename {
      font-size: 12px; font-family: "SF Mono","Menlo",monospace;
      color: var(--blue); flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #logContent {
      background: var(--console);
      border: 1px solid var(--border);
      border-radius: 8px; padding: 14px;
      flex: 1; min-height: 300px; max-height: 480px;
      overflow-y: auto;
      font-family: "SF Mono","Fira Code","Menlo",monospace;
      font-size: 12px; line-height: 1.65;
      white-space: pre-wrap; word-break: break-all;
      color: #718096;
    }
    .viewer-placeholder {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; gap: 8px;
      color: var(--muted); font-size: 13px; text-align: center;
    }
    .viewer-placeholder .ph-icon { font-size: 32px; opacity: .4; }

    /* Scrollbars */
    .file-tree::-webkit-scrollbar,
    #logContent::-webkit-scrollbar { width: 5px; }
    .file-tree::-webkit-scrollbar-track,
    #logContent::-webkit-scrollbar-track { background: transparent; }
    .file-tree::-webkit-scrollbar-thumb,
    #logContent::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    footer {
      margin-top: 16px; font-size: 12px;
      color: var(--muted); text-align: center;
    }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">🏷️</div>
  <div>
    <h1>メルカリ 自動値引きツール</h1>
    <p>管理メニュー</p>
  </div>
</header>

<!-- Menu -->
<div class="section-label">メニュー</div>
<div class="menu-grid">

  <a class="menu-card" href="/products">
    <div class="menu-card-icon icon-green">📋</div>
    <div class="menu-card-title">商品一覧</div>
    <div class="menu-card-desc">CSVの作成・更新や、商品ごとの値引き実行を行います。対象外商品の除外設定も可能です。</div>
    <div class="menu-card-arrow">
      開く
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </div>
  </a>

</div>

<!-- Log explorer -->
<div class="card">
  <div class="toolbar">
    <div class="card-title" style="margin-bottom:0">ログファイル</div>
    <button class="ghost-btn" onclick="loadLogList()">更新</button>
  </div>
  <div class="log-layout">

    <div class="file-tree" id="fileTree">
      <div class="tree-empty">読み込み中…</div>
    </div>

    <div class="viewer-wrap">
      <div class="viewer-header">
        <span class="viewer-filename" id="viewerFilename"></span>
        <button class="ghost-btn" id="scrollBottomBtn"
                onclick="scrollToBottom()" style="display:none">最下部へ</button>
      </div>
      <div id="logContent">
        <div class="viewer-placeholder">
          <span class="ph-icon">📄</span>
          左のファイル一覧からログを選択してください
        </div>
      </div>
    </div>

  </div>
</div>

<footer>Mercari Auto Price Down Tool — ローカル管理UI</footer>

<script>
  const fileTree    = document.getElementById('fileTree');
  const logContent  = document.getElementById('logContent');
  const viewerFname = document.getElementById('viewerFilename');
  const scrollBtn   = document.getElementById('scrollBottomBtn');
  let activeItem    = null;

  async function loadLogList() {
    fileTree.innerHTML = '<div class="tree-empty">読み込み中…</div>';
    try {
      const res  = await fetch('/logs');
      const data = await res.json();
      renderFileTree(data.dirs || []);
    } catch (err) {
      fileTree.innerHTML = `<div class="tree-empty">エラー: ${err.message}</div>`;
    }
  }

  function renderFileTree(dirs) {
    if (!dirs || dirs.length === 0) {
      fileTree.innerHTML = '<div class="tree-empty">ログディレクトリが見つかりません</div>';
      return;
    }
    fileTree.innerHTML = '';
    dirs.forEach(dir => {
      const header = document.createElement('div');
      header.className = 'tree-dir';
      header.innerHTML = `<span class="tree-dir-icon">📁</span>${escHtml(dir.name)}`;
      fileTree.appendChild(header);
      if (!dir.files || dir.files.length === 0) {
        const empty = document.createElement('div');
        empty.style.cssText = 'padding:4px 20px 8px;font-size:11px;color:var(--muted)';
        empty.textContent = 'ファイルなし';
        fileTree.appendChild(empty);
        return;
      }
      dir.files.forEach(fname => {
        const path = dir.name + '/' + fname;
        const item = document.createElement('div');
        item.className = 'file-item' + (path === activeItem ? ' active' : '');
        item.dataset.path = path;
        item.innerHTML = `<span class="file-icon">📄</span>${escHtml(fname)}`;
        item.onclick = () => openLogFile(path, item);
        fileTree.appendChild(item);
      });
    });
  }

  async function openLogFile(path, itemEl) {
    document.querySelectorAll('.file-item.active').forEach(el => el.classList.remove('active'));
    itemEl.classList.add('active');
    activeItem = path;
    viewerFname.textContent = path;
    logContent.textContent = '読み込み中…';
    scrollBtn.style.display = 'none';
    try {
      const res  = await fetch('/logfile?path=' + encodeURIComponent(path));
      const data = await res.json();
      logContent.textContent = data.content || '（空のファイル）';
      logContent.scrollTop   = logContent.scrollHeight;
      scrollBtn.style.display = 'block';
    } catch (err) {
      logContent.textContent = 'エラー: ' + err.message;
    }
  }

  function scrollToBottom() { logContent.scrollTop = logContent.scrollHeight; }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  loadLogList();
  setInterval(loadLogList, 60_000);
</script>
</body>
</html>
