<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メルカリ自動値引きツール</title>
  <style id="page-style">
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --surface2: #22263a;
      --border:   #2e3250;
      --accent:   #ff6b35;
      --green:    #22c55e;
      --yellow:   #f59e0b;
      --red:      #ef4444;
      --blue:     #60a5fa;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --console:  #0a0c14;
      --radius:   12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
                   "Noto Sans JP", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 80px;
    }

    /* ── Header ─────────────────────────────── */
    header {
      width: 100%; max-width: 960px;
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 48px;
    }
    .logo {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, var(--accent), #ff3c7a);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; flex-shrink: 0;
    }
    header h1 { font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
    header p  { font-size: 13px; color: var(--muted); margin-top: 3px; }

    /* ── Section title ────────────────────── */
    .section-label {
      width: 100%; max-width: 960px;
      font-size: 11px; font-weight: 700;
      color: var(--muted); text-transform: uppercase;
      letter-spacing: .09em; margin-bottom: 14px;
    }

    /* ── Menu grid ───────────────────────── */
    .menu-grid {
      width: 100%; max-width: 960px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 48px;
    }

    .menu-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 24px;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color .15s, background .15s, transform .1s;
      cursor: pointer;
    }
    .menu-card:hover {
      border-color: var(--accent);
      background: var(--surface2);
      transform: translateY(-2px);
    }
    .menu-card:active { transform: translateY(0); }

    .menu-card-icon {
      width: 44px; height: 44px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .icon-green  { background: linear-gradient(135deg, #059669, #047857); }
    .icon-blue   { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
    .icon-purple { background: linear-gradient(135deg, #7c3aed, #5b21b6); }

    .menu-card-title {
      font-size: 16px; font-weight: 700;
    }
    .menu-card-desc {
      font-size: 13px; color: var(--muted); line-height: 1.55;
    }
    .menu-card-arrow {
      margin-top: auto;
      font-size: 12px; color: var(--muted);
      display: flex; align-items: center; gap: 4px;
    }

    /* ── Card (log explorer) ──────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%; max-width: 960px;
      margin-bottom: 20px;
    }
    .card-title {
      font-size: 12px; font-weight: 600;
      color: var(--muted); text-transform: uppercase;
      letter-spacing: .08em; margin-bottom: 16px;
    }
    .toolbar {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 12px;
    }
    .ghost-btn {
      font-size: 12px; color: var(--muted); background: none;
      border: 1px solid var(--border); border-radius: 6px;
      padding: 4px 10px; cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    .ghost-btn:hover { color: var(--text); border-color: var(--muted); }

    /* ── Log explorer ────────────────────── */
    .log-layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 14px;
      min-height: 360px;
    }
    @media (max-width: 640px) {
      .log-layout { grid-template-columns: 1fr; }
    }

    .file-tree {
      background: var(--console);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow-y: auto;
      padding: 8px 0;
    }
    .tree-dir {
      padding: 6px 12px 4px;
      font-size: 11px; font-weight: 700;
      color: var(--muted); text-transform: uppercase;
      letter-spacing: .06em;
      display: flex; align-items: center; gap: 6px;
    }
    .tree-dir-icon { opacity: .6; font-size: 13px; }
    .tree-empty {
      padding: 32px 12px;
      font-size: 12px; color: var(--muted); text-align: center;
    }
    .file-item {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 12px 5px 20px;
      font-size: 12px; font-family: "SF Mono","Menlo",monospace;
      color: #718096; cursor: pointer;
      border-left: 2px solid transparent;
      transition: background .12s, color .12s, border-color .12s;
      word-break: break-all;
    }
    .file-item:hover  { background: var(--surface2); color: var(--text); }
    .file-item.active {
      background: var(--surface2);
      color: var(--blue);
      border-left-color: var(--blue);
    }
    .file-icon { font-size: 12px; flex-shrink: 0; }

    .viewer-wrap { display: flex; flex-direction: column; gap: 8px; }
    .viewer-header { display: flex; align-items: center; gap: 10px; }
    .viewer-filename {
      font-size: 12px; font-family: "SF Mono","Menlo",monospace;
      color: var(--blue); flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #logContent {
      background: var(--console);
      border: 1px solid var(--border);
      border-radius: 8px; padding: 14px;
      flex: 1; min-height: 300px; max-height: 480px;
      overflow-y: auto;
      font-family: "SF Mono","Fira Code","Menlo",monospace;
      font-size: 12px; line-height: 1.65;
      white-space: pre-wrap; word-break: break-all;
      color: #718096;
    }
    .viewer-placeholder {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; gap: 8px;
      color: var(--muted); font-size: 13px; text-align: center;
    }
    .viewer-placeholder .ph-icon { font-size: 32px; opacity: .4; }

    /* Scrollbars */
    .file-tree::-webkit-scrollbar,
    #logContent::-webkit-scrollbar { width: 5px; }
    .file-tree::-webkit-scrollbar-track,
    #logContent::-webkit-scrollbar-track { background: transparent; }
    .file-tree::-webkit-scrollbar-thumb,
    #logContent::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    footer {
      margin-top: 16px; font-size: 12px;
      color: var(--muted); text-align: center;
    }

    /* ── Nav Drawer ──────────────────────────────────── */
    .ham-btn {
      position: fixed; top: 16px; right: 16px; z-index: 1000;
      width: 42px; height: 42px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 5px;
      transition: border-color .15s, background .15s;
    }
    .ham-btn:hover { border-color: var(--accent); background: var(--surface); }
    .ham-line {
      width: 18px; height: 2px;
      background: var(--text); border-radius: 2px;
      transition: transform .25s ease, opacity .2s ease;
    }
    .ham-btn.is-open .ham-line:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .ham-btn.is-open .ham-line:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .ham-btn.is-open .ham-line:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .nav-backdrop {
      position: fixed; inset: 0; z-index: 900;
      background: rgba(0,0,0,.55); backdrop-filter: blur(3px);
      opacity: 0; pointer-events: none; transition: opacity .25s ease;
    }
    .nav-backdrop.is-open { opacity: 1; pointer-events: all; }
    .nav-drawer {
      position: fixed; top: 0; right: -270px; bottom: 0; z-index: 950;
      width: 260px; background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column; padding-top: 16px;
      transition: right .28s cubic-bezier(.4,0,.2,1); overflow-y: auto;
    }
    .nav-drawer.is-open { right: 0; }
    .nav-drawer-head {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 18px 18px; border-bottom: 1px solid var(--border);
    }
    .nav-drawer-logo {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--accent), #ff3c7a);
      border-radius: 8px; display: flex; align-items: center;
      justify-content: center; font-size: 17px; flex-shrink: 0;
    }
    .nav-drawer-title { font-size: 13px; font-weight: 700; color: var(--text); }
    .nav-drawer-sub   { font-size: 11px; color: var(--muted); }
    .nav-links { padding: 10px 0; flex: 1; }
    .nav-link {
      display: flex; align-items: center; gap: 11px;
      padding: 11px 18px; text-decoration: none; color: var(--muted);
      font-size: 14px; font-weight: 500;
      border-left: 3px solid transparent;
      transition: color .15s, background .15s, border-color .15s;
    }
    .nav-link:hover { color: var(--text); background: var(--surface2); }
    .nav-link.is-active {
      color: var(--text); background: rgba(255,107,53,.08);
      border-left-color: var(--accent); font-weight: 600;
    }
    .nav-link-icon { font-size: 17px; flex-shrink: 0; width: 22px; text-align: center; }
    .nav-sep { height: 1px; background: var(--border); margin: 8px 18px; }
  </style>
</head>
<body>

<div id="app-content">

<!-- Header -->
<header>
  <div class="logo">🏷️</div>
  <div>
    <h1>メルカリ 自動値引きツール</h1>
    <p>管理メニュー</p>
  </div>
</header>

<!-- Menu -->
<div class="section-label">メニュー</div>
<div class="menu-grid">

  <a class="menu-card" href="/products" data-navpath="/products">
    <div class="menu-card-icon icon-green">📋</div>
    <div class="menu-card-title">出品中商品一覧</div>
    <div class="menu-card-desc">CSVの作成・更新や値引き実行、対象外設定ができます。値下げ履歴も一覧で確認できます。</div>
    <div class="menu-card-arrow">
      開く
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </div>
  </a>

  <a class="menu-card" href="/research" data-navpath="/research">
    <div class="menu-card-icon icon-blue">🔍</div>
    <div class="menu-card-title">売れ筋リサーチ</div>
    <div class="menu-card-desc">カテゴリー別に売り切れ商品を最大5ページ分調査。売れている商品トレンドを把握して売上・利益を最大化。</div>
    <div class="menu-card-arrow">
      開く
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </div>
  </a>

</div>

<!-- Log explorer -->
<div class="card">
  <div class="toolbar">
    <div class="card-title" style="margin-bottom:0">ログファイル</div>
    <button class="ghost-btn" onclick="loadLogList()">更新</button>
  </div>
  <div class="log-layout">

    <div class="file-tree" id="fileTree">
      <div class="tree-empty">読み込み中…</div>
    </div>

    <div class="viewer-wrap">
      <div class="viewer-header">
        <span class="viewer-filename" id="viewerFilename"></span>
        <button class="ghost-btn" id="scrollBottomBtn"
                onclick="scrollToBottom()" style="display:none">最下部へ</button>
      </div>
      <div id="logContent">
        <div class="viewer-placeholder">
          <span class="ph-icon">📄</span>
          左のファイル一覧からログを選択してください
        </div>
      </div>
    </div>

  </div>
</div>

<footer>Mercari Auto Price Down Tool — ローカル管理UI</footer>

<script>
  var fileTree    = document.getElementById('fileTree');
  var logContent  = document.getElementById('logContent');
  var viewerFname = document.getElementById('viewerFilename');
  var scrollBtn   = document.getElementById('scrollBottomBtn');
  var activeItem  = null;
  var _logListTimer = null;

  function loadLogList() {
    fileTree.innerHTML = '<div class="tree-empty">読み込み中…</div>';
    fetch('/logs').then(function(res){ return res.json(); }).then(function(data){
      renderFileTree(data.dirs || []);
    }).catch(function(err){
      fileTree.innerHTML = '<div class="tree-empty">エラー: ' + err.message + '</div>';
    });
  }

  function renderFileTree(dirs) {
    if (!dirs || dirs.length === 0) {
      fileTree.innerHTML = '<div class="tree-empty">ログディレクトリが見つかりません</div>';
      return;
    }
    fileTree.innerHTML = '';
    dirs.forEach(function(dir) {
      var header = document.createElement('div');
      header.className = 'tree-dir';
      header.innerHTML = '<span class="tree-dir-icon">📁</span>' + escHtml(dir.name);
      fileTree.appendChild(header);
      if (!dir.files || dir.files.length === 0) {
        var empty = document.createElement('div');
        empty.style.cssText = 'padding:4px 20px 8px;font-size:11px;color:var(--muted)';
        empty.textContent = 'ファイルなし';
        fileTree.appendChild(empty);
        return;
      }
      dir.files.forEach(function(fname) {
        var path = dir.name + '/' + fname;
        var item = document.createElement('div');
        item.className = 'file-item' + (path === activeItem ? ' active' : '');
        item.dataset.path = path;
        item.innerHTML = '<span class="file-icon">📄</span>' + escHtml(fname);
        item.onclick = function(){ openLogFile(path, item); };
        fileTree.appendChild(item);
      });
    });
  }

  function openLogFile(path, itemEl) {
    document.querySelectorAll('.file-item.active').forEach(function(el){ el.classList.remove('active'); });
    itemEl.classList.add('active');
    activeItem = path;
    viewerFname.textContent = path;
    logContent.textContent = '読み込み中…';
    scrollBtn.style.display = 'none';
    fetch('/logfile?path=' + encodeURIComponent(path)).then(function(res){ return res.json(); }).then(function(data){
      logContent.textContent = data.content || '（空のファイル）';
      logContent.scrollTop   = logContent.scrollHeight;
      scrollBtn.style.display = 'block';
    }).catch(function(err){
      logContent.textContent = 'エラー: ' + err.message;
    });
  }

  function scrollToBottom() { logContent.scrollTop = logContent.scrollHeight; }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  loadLogList();
  _logListTimer = setInterval(loadLogList, 60000);

  window.__pageCleanup = function() {
    if (_logListTimer) { clearInterval(_logListTimer); _logListTimer = null; }
  };
</script>

</div><!-- /#app-content -->

<!-- ─── Navigation Drawer ──────────────────────────────── -->
<button class="ham-btn" id="hamBtn" onclick="navToggle()" aria-label="メニューを開く">
  <span class="ham-line"></span>
  <span class="ham-line"></span>
  <span class="ham-line"></span>
</button>
<div class="nav-backdrop" id="navBackdrop" onclick="navClose()"></div>
<nav class="nav-drawer" id="navDrawer" aria-hidden="true">
  <div class="nav-drawer-head">
    <div class="nav-drawer-logo">🏷️</div>
    <div>
      <div class="nav-drawer-title">メルカリ 値引きツール</div>
      <div class="nav-drawer-sub">管理メニュー</div>
    </div>
  </div>
  <div class="nav-links">
    <a class="nav-link" href="/" data-navpath="/"><span class="nav-link-icon">🏠</span>ホーム</a>
    <a class="nav-link" href="/products" data-navpath="/products"><span class="nav-link-icon">📋</span>出品中商品一覧</a>
    <a class="nav-link" href="/pl"       data-navpath="/pl"><span class="nav-link-icon">💹</span>利益管理 (P&amp;L)</a>
    <a class="nav-link" href="/research" data-navpath="/research"><span class="nav-link-icon">🔍</span>売れ筋リサーチ</a>
    <div class="nav-sep"></div>
    <a class="nav-link" href="/settings" data-navpath="/settings"><span class="nav-link-icon">⚙️</span>設定</a>
  </div>
</nav>
<script>
(function(){
  window.navToggle = function() {
    var open = document.getElementById('navDrawer').classList.toggle('is-open');
    document.getElementById('hamBtn').classList.toggle('is-open', open);
    document.getElementById('navBackdrop').classList.toggle('is-open', open);
    document.getElementById('navDrawer').setAttribute('aria-hidden', String(!open));
  };
  window.navClose = function() {
    document.getElementById('navDrawer').classList.remove('is-open');
    document.getElementById('hamBtn').classList.remove('is-open');
    document.getElementById('navBackdrop').classList.remove('is-open');
    document.getElementById('navDrawer').setAttribute('aria-hidden', 'true');
  };
  (function(){
    var p = location.pathname;
    document.querySelectorAll('.nav-link[data-navpath]').forEach(function(el){
      el.classList.toggle('is-active', el.dataset.navpath === p);
    });
  })();
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') navClose(); });
  if (window.__SPA_INITIALIZED__) return;
  window.__SPA_INITIALIZED__ = true;
  window.SPA = {
    _esMap:{}, _logs:{research:[],discount:[],csv:[]}, _runningSet:new Set(),
    connect: function(t) {
      var ep=t==='research'?'/events/research':'/events';
      this._runningSet.add(t); this._logs[t]=[];
      if(this._esMap[t]){this._esMap[t].close();delete this._esMap[t];}
      var self=this, es=new EventSource(ep); this._esMap[t]=es;
      es.onmessage=function(e){
        if(e.data==='__DONE__'){self._runningSet.delete(t);document.dispatchEvent(new CustomEvent('spa:done',{detail:{taskType:t,ok:true}}));es.close();delete self._esMap[t];return;}
        self._logs[t].push(e.data);document.dispatchEvent(new CustomEvent('spa:log',{detail:{taskType:t,line:e.data}}));
      };
      es.onerror=function(){self._runningSet.delete(t);document.dispatchEvent(new CustomEvent('spa:done',{detail:{taskType:t,ok:false}}));es.close();delete self._esMap[t];};
    },
    isRunning:function(t){return this._runningSet.has(t);},
    isAnyRunning:function(){return this._runningSet.size>0;},
    getLines:function(t){return(this._logs[t]||[]).slice();},
    clearLog:function(t){this._logs[t]=[];}
  };
  // ── Global status bar ─────────────────────────────────────
  (function(){
    var barEl = document.createElement('div');
    barEl.id = 'spa-status-bar';
    barEl.innerHTML = '<div class="ssb-row"><span class="ssb-dot"></span><span class="ssb-label">—</span><span class="ssb-line">—</span><button class="ssb-close" onclick="document.getElementById(\'spa-status-bar\').classList.remove(\'is-visible\')">✕</button></div><div class="ssb-track"><div class="ssb-fill" id="ssb-fill"></div></div>';
    document.body.appendChild(barEl);
    var styleEl = document.createElement('style');
    styleEl.textContent = '#spa-status-bar{position:fixed;bottom:-90px;left:50%;transform:translateX(-50%);width:min(640px,calc(100vw - 32px));background:#1a1d27;border:1px solid #2e3250;border-radius:12px;padding:12px 16px 10px;box-shadow:0 8px 32px rgba(0,0,0,.6);z-index:1500;transition:bottom .3s cubic-bezier(.4,0,.2,1);pointer-events:none}#spa-status-bar.is-visible{bottom:16px;pointer-events:all}.ssb-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}.ssb-dot{width:8px;height:8px;border-radius:50%;background:#60a5fa;flex-shrink:0;animation:ssbPulse 1s infinite}#spa-status-bar.is-done .ssb-dot{background:#22c55e;animation:none}#spa-status-bar.is-error .ssb-dot{background:#ef4444;animation:none}@keyframes ssbPulse{0%,100%{opacity:1}50%{opacity:.3}}.ssb-label{font-size:12px;font-weight:700;color:#e2e8f0;flex-shrink:0}.ssb-line{font-size:11px;color:#64748b;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:"SF Mono","Menlo",monospace}.ssb-close{background:none;border:none;color:#64748b;cursor:pointer;font-size:14px;padding:0 2px;flex-shrink:0}.ssb-close:hover{color:#e2e8f0}.ssb-track{height:3px;background:#22263a;border-radius:999px;overflow:hidden}.ssb-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#60a5fa,#818cf8)}#spa-status-bar.is-done .ssb-fill{background:#22c55e}#spa-status-bar.is-error .ssb-fill{background:#ef4444}#spa-status-bar:not(.is-done):not(.is-error) .ssb-fill{width:40%;animation:ssbSlide 1.5s ease-in-out infinite}#spa-status-bar.is-done .ssb-fill{width:100%;transition:width .3s;animation:none}#spa-status-bar.is-error .ssb-fill{width:100%;transition:width .3s;animation:none}@keyframes ssbSlide{0%{margin-left:-40%}100%{margin-left:100%}}';
    document.head.appendChild(styleEl);
    var _ssbLabels = {research:'売れ筋リサーチ中', discount:'値引き実行中', csv:'CSV更新中'};
    var _ssbBar = document.getElementById('spa-status-bar');
    document.addEventListener('spa:log', function(e) {
      if (!e.detail || !_ssbBar) return;
      _ssbBar.querySelector('.ssb-label').textContent = _ssbLabels[e.detail.taskType] || e.detail.taskType;
      _ssbBar.querySelector('.ssb-line').textContent  = e.detail.line;
      _ssbBar.classList.remove('is-done','is-error');
      _ssbBar.classList.add('is-visible');
    });
    document.addEventListener('spa:done', function(e) {
      if (!e.detail || !_ssbBar) return;
      var label = _ssbLabels[e.detail.taskType] || e.detail.taskType;
      var msg   = e.detail.ok ? '処理が完了しました' : 'エラーが発生しました';
      _ssbBar.querySelector('.ssb-label').textContent = label;
      _ssbBar.querySelector('.ssb-line').textContent  = msg;
      _ssbBar.classList.remove('is-done','is-error');
      _ssbBar.classList.add(e.detail.ok ? 'is-done' : 'is-error');
      setTimeout(function(){ _ssbBar.classList.remove('is-visible','is-done','is-error'); }, 4000);
      _spaPlaySound(e.detail.ok);
      _spaNotify(label, msg, e.detail.ok);
    });
    function _spaPlaySound(ok) {
      try {
        var ac = new (window.AudioContext || window.webkitAudioContext)();
        if (ok) {
          [[660,0],[880,0.18]].forEach(function(p){
            var o=ac.createOscillator(), g=ac.createGain();
            o.connect(g); g.connect(ac.destination);
            o.type='sine'; o.frequency.value=p[0];
            g.gain.setValueAtTime(0.22, ac.currentTime+p[1]);
            g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+p[1]+0.45);
            o.start(ac.currentTime+p[1]); o.stop(ac.currentTime+p[1]+0.45);
          });
        } else {
          var o=ac.createOscillator(), g=ac.createGain();
          o.connect(g); g.connect(ac.destination);
          o.type='sine'; o.frequency.value=320;
          g.gain.setValueAtTime(0.25, ac.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+0.55);
          o.start(ac.currentTime); o.stop(ac.currentTime+0.55);
        }
      } catch(e){}
    }
    function _spaNotify(label, body, ok) {
      if (!('Notification' in window)) return;
      var title = label + (ok ? ' 完了 ✓' : ' エラー ✗');
      if (Notification.permission === 'granted') {
        new Notification(title, {body: body, silent: true});
      } else if (Notification.permission !== 'denied') {
        Notification.requestPermission().then(function(p){
          if (p === 'granted') new Notification(title, {body: body, silent: true});
        });
      }
    }
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }
  })();
  document.addEventListener('click',function(e){
    var link=e.target.closest('a[data-navpath]'); if(!link)return;
    var href=link.getAttribute('href'); if(!href)return;
    e.preventDefault(); if(href===location.pathname){navClose();return;}
    _spaNavigate(href);
  });
  function _spaNavigate(href){
    if (typeof window.__spaIntercept === 'function' && window.__spaIntercept(href)) return;
    fetch(href).then(function(r){return r.text();}).then(function(html){
      var doc=new DOMParser().parseFromString(html,'text/html');
      var nc=doc.getElementById('app-content'),cc=document.getElementById('app-content');
      if(!nc||!cc){location.href=href;return;}
      if(typeof window.__pageCleanup==='function'){window.__pageCleanup();window.__pageCleanup=null;}
      var newCss=Array.from(doc.head.querySelectorAll('style')).map(function(s){return s.textContent;}).join('\n');
      var ps=document.getElementById('page-style');
      if(ps){ps.textContent=newCss;}else{var ns=document.createElement('style');ns.id='page-style';ns.textContent=newCss;document.head.appendChild(ns);}
      cc.replaceWith(nc); history.pushState({},'',href); document.title=doc.title;
      document.querySelectorAll('.nav-link[data-navpath]').forEach(function(el){el.classList.toggle('is-active',el.dataset.navpath===href);});
      nc.querySelectorAll('script').forEach(function(s){var ns=document.createElement('script');ns.textContent=s.textContent;document.head.appendChild(ns);ns.remove();});
      navClose();
    }).catch(function(){location.href=href;});
  }
  window.addEventListener('popstate',function(){_spaNavigate(location.pathname);});
})();
</script>
