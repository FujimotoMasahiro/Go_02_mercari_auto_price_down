<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>値下げ履歴 — メルカリ自動値引きツール</title>
  <style id="page-style">
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --surface2: #22263a;
      --border:   #2e3250;
      --accent:   #ff6b35;
      --green:    #22c55e;
      --yellow:   #f59e0b;
      --red:      #ef4444;
      --blue:     #60a5fa;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --radius:   12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
                   "Noto Sans JP", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 80px;
    }

    /* ── Header ─────────────────────────────── */
    header {
      width: 100%; max-width: 1100px;
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 36px;
    }
    .logo {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, #7c3aed, #5b21b6);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    header h1 { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
    header p  { font-size: 13px; color: var(--muted); margin-top: 2px; }

    /* ── Card ────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%; max-width: 1100px;
      margin-bottom: 20px;
    }
    .table-toolbar {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 12px;
    }
    .table-toolbar-label {
      font-size: 12px; font-weight: 600;
      color: var(--muted); text-transform: uppercase;
      letter-spacing: .08em; margin-right: auto;
    }
    .ghost-btn {
      font-size: 12px; color: var(--muted); background: none;
      border: 1px solid var(--border); border-radius: 6px;
      padding: 5px 12px; cursor: pointer;
      transition: color .15s, border-color .15s; white-space: nowrap;
    }
    .ghost-btn:hover { color: var(--text); border-color: var(--muted); }

    /* ── Table ───────────────────────────────── */
    .table-wrap {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    table {
      width: 100%; border-collapse: collapse; font-size: 14px;
    }
    thead { background: var(--surface2); position: sticky; top: 0; }
    th {
      padding: 12px 14px;
      text-align: left; font-size: 11px; font-weight: 700;
      color: var(--muted); text-transform: uppercase; letter-spacing: .07em;
      border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    th.run-col { text-align: right; min-width: 130px; }
    th.run-col .run-date { color: var(--text); font-size: 12px; text-transform: none; letter-spacing: 0; }
    th.run-col .run-time { color: var(--muted); font-size: 11px; font-weight: 400; }

    td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text); line-height: 1.4; vertical-align: middle;
    }
    td.img-cell  { width: 56px; padding: 8px 10px; }
    td.name-cell { min-width: 160px; max-width: 240px; }
    td.num-cell  { color: var(--muted); font-size: 12px; width: 36px; }
    td.price-cell {
      text-align: right; font-family: "SF Mono","Menlo",monospace;
      font-weight: 600; white-space: nowrap; min-width: 130px;
    }
    td.price-cell .yen      { color: var(--yellow); }
    td.price-cell .yen-old  { color: var(--muted); text-decoration: line-through; font-size: 11px; display: block; margin-top: 2px; }
    td.price-cell .no-data  { color: var(--border); font-size: 13px; }
    td.price-cell .skip-badge {
      display: inline-block; background: rgba(245,158,11,.15);
      border: 1px solid rgba(245,158,11,.4); color: var(--yellow);
      border-radius: 4px; font-size: 10px; font-weight: 700;
      padding: 1px 6px; font-family: inherit; letter-spacing: .02em;
    }
    td.price-cell .skip-price { color: var(--muted); font-size: 11px; display: block; margin-top: 3px; }

    .thumb {
      width: 40px; height: 40px;
      object-fit: cover; border-radius: 6px; display: block;
    }
    .no-img {
      display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px;
      background: var(--surface2); border-radius: 6px;
      font-size: 18px; opacity: .45;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }

    .table-empty {
      text-align: center; padding: 48px 16px;
      color: var(--muted); font-size: 14px;
    }
    .table-empty .empty-icon { font-size: 36px; display: block; margin-bottom: 12px; opacity: .5; }

    .summary { font-size: 12px; color: var(--muted); margin-top: 12px; text-align: right; }

    footer { margin-top: 16px; font-size: 12px; color: var(--muted); text-align: center; }

    /* ── Nav Drawer ──────────────────────────────────── */
    .ham-btn {
      position: fixed; top: 16px; right: 16px; z-index: 1000;
      width: 42px; height: 42px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 5px;
      transition: border-color .15s, background .15s;
    }
    .ham-btn:hover { border-color: var(--accent); background: var(--surface); }
    .ham-line {
      width: 18px; height: 2px;
      background: var(--text); border-radius: 2px;
      transition: transform .25s ease, opacity .2s ease;
    }
    .ham-btn.is-open .ham-line:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .ham-btn.is-open .ham-line:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .ham-btn.is-open .ham-line:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .nav-backdrop {
      position: fixed; inset: 0; z-index: 900;
      background: rgba(0,0,0,.55); backdrop-filter: blur(3px);
      opacity: 0; pointer-events: none; transition: opacity .25s ease;
    }
    .nav-backdrop.is-open { opacity: 1; pointer-events: all; }
    .nav-drawer {
      position: fixed; top: 0; right: -270px; bottom: 0; z-index: 950;
      width: 260px; background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column; padding-top: 16px;
      transition: right .28s cubic-bezier(.4,0,.2,1); overflow-y: auto;
    }
    .nav-drawer.is-open { right: 0; }
    .nav-drawer-head {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 18px 18px; border-bottom: 1px solid var(--border);
    }
    .nav-drawer-logo {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--accent), #ff3c7a);
      border-radius: 8px; display: flex; align-items: center;
      justify-content: center; font-size: 17px; flex-shrink: 0;
    }
    .nav-drawer-title { font-size: 13px; font-weight: 700; color: var(--text); }
    .nav-drawer-sub   { font-size: 11px; color: var(--muted); }
    .nav-links { padding: 10px 0; flex: 1; }
    .nav-link {
      display: flex; align-items: center; gap: 11px;
      padding: 11px 18px; text-decoration: none; color: var(--muted);
      font-size: 14px; font-weight: 500;
      border-left: 3px solid transparent;
      transition: color .15s, background .15s, border-color .15s;
    }
    .nav-link:hover { color: var(--text); background: var(--surface2); }
    .nav-link.is-active {
      color: var(--text); background: rgba(255,107,53,.08);
      border-left-color: var(--accent); font-weight: 600;
    }
    .nav-link-icon { font-size: 17px; flex-shrink: 0; width: 22px; text-align: center; }
    .nav-sep { height: 1px; background: var(--border); margin: 8px 18px; }
  </style>
</head>
<body>

<div id="app-content">

<header>
  <div class="logo">📈</div>
  <div>
    <h1>値下げ履歴</h1>
    <p>直近5回の値引き実行ごとの価格変動</p>
  </div>
</header>

<div class="card">
  <div class="table-toolbar">
    <span class="table-toolbar-label">商品 × 実行日時</span>
    <button class="ghost-btn" onclick="loadHistory()">更新</button>
  </div>
  <div class="table-wrap">
    <table id="historyTable">
      <thead id="historyHead"></thead>
      <tbody id="historyBody">
        <tr><td colspan="10" class="table-empty">
          <span class="empty-icon">📊</span>読み込み中…
        </td></tr>
      </tbody>
    </table>
  </div>
  <div class="summary" id="summary"></div>
</div>

<footer>Mercari Auto Price Down Tool — ローカル管理UI</footer>

<script>
  async function loadHistory() {
    try {
      const res  = await fetch('/history-data');
      const data = await res.json();
      render(data);
    } catch (err) {
      document.getElementById('historyBody').innerHTML = `
        <tr><td colspan="10" class="table-empty">
          <span class="empty-icon">⚠️</span>エラー: ${escHtml(err.message)}
        </td></tr>`;
    }
  }

  function render({ runs, products }) {
    const head    = document.getElementById('historyHead');
    const body    = document.getElementById('historyBody');
    const summary = document.getElementById('summary');

    if (!runs || runs.length === 0) {
      head.innerHTML = '';
      body.innerHTML = `<tr><td colspan="10" class="table-empty">
        <span class="empty-icon">📊</span>
        値下げ履歴がありません。値引き実行後にここへ記録されます。
      </td></tr>`;
      summary.innerHTML = '';
      return;
    }

    // ── ヘッダー行 ──────────────────────────────
    const runHeaders = runs.map(r => {
      const dt   = new Date(r.timestamp);
      const date = dt.toLocaleDateString('ja-JP', { month: '2-digit', day: '2-digit' });
      const time = dt.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
      return `<th class="run-col">
        <span class="run-date">${escHtml(date)}</span><br>
        <span class="run-time">${escHtml(time)}</span>
      </th>`;
    }).join('');

    head.innerHTML = `<tr>
      <th>#</th>
      <th>画像</th>
      <th>商品名</th>
      ${runHeaders}
    </tr>`;

    // ── データ行 ────────────────────────────────
    if (!products || products.length === 0) {
      body.innerHTML = `<tr><td colspan="${3 + runs.length}" class="table-empty">
        <span class="empty-icon">📦</span>商品データがありません。
      </td></tr>`;
      summary.innerHTML = '';
      return;
    }

    body.innerHTML = products.map((p, i) => {
      const img = p.imagePath
        ? `<img src="${escHtml(p.imagePath)}" class="thumb" alt=""
               onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'no-img',textContent:'📷'}))">`
        : `<span class="no-img">📷</span>`;

      const priceCells = (p.cells || []).map(cell => {
        if (cell.price !== null && cell.price !== undefined) {
          // 値引き成功
          const oldHtml = (cell.oldPrice !== null && cell.oldPrice !== undefined)
            ? `<span class="yen-old">¥${cell.oldPrice.toLocaleString('ja-JP')}</span>`
            : '';
          return `<td class="price-cell">
            <span class="yen">¥${cell.price.toLocaleString('ja-JP')}</span>
            ${oldHtml}
          </td>`;
        }
        if (cell.reason) {
          // スキップ
          const priceHtml = (cell.oldPrice !== null && cell.oldPrice !== undefined)
            ? `<span class="skip-price">¥${cell.oldPrice.toLocaleString('ja-JP')}</span>`
            : '';
          return `<td class="price-cell">
            <span class="skip-badge">${escHtml(cell.reason)}</span>
            ${priceHtml}
          </td>`;
        }
        // データなし
        return `<td class="price-cell"><span class="no-data">—</span></td>`;
      }).join('');

      return `<tr>
        <td class="num-cell">${i + 1}</td>
        <td class="img-cell">${img}</td>
        <td class="name-cell">${escHtml(p.itemName || '（名称なし）')}</td>
        ${priceCells}
      </tr>`;
    }).join('');

    summary.innerHTML = `${products.length}件 / 直近${runs.length}回分`;
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  loadHistory();
</script>

</div><!-- /#app-content -->

<!-- ═══════════════════════════════════ NAV DRAWER ════════════════════════════════════ -->
<button class="ham-btn" id="hamBtn" onclick="navToggle()" aria-label="メニューを開く">
  <span class="ham-line"></span>
  <span class="ham-line"></span>
  <span class="ham-line"></span>
</button>
<div class="nav-backdrop" id="navBackdrop" onclick="navClose()"></div>
<nav class="nav-drawer" id="navDrawer" aria-hidden="true">
  <div class="nav-drawer-head">
    <div class="nav-drawer-logo">🏷️</div>
    <div>
      <div class="nav-drawer-title">メルカリ 値引きツール</div>
      <div class="nav-drawer-sub">管理メニュー</div>
    </div>
  </div>
  <div class="nav-links">
    <a class="nav-link" href="/"         data-navpath="/"><span class="nav-link-icon">🏠</span>ホーム</a>
    <a class="nav-link" href="/products" data-navpath="/products"><span class="nav-link-icon">📋</span>出品中商品一覧</a>
    <a class="nav-link" href="/pl"       data-navpath="/pl"><span class="nav-link-icon">💹</span>利益管理 (P&amp;L)</a>
    <a class="nav-link" href="/research" data-navpath="/research"><span class="nav-link-icon">🔍</span>売れ筋リサーチ</a>
    <div class="nav-sep"></div>
    <a class="nav-link" href="/settings" data-navpath="/settings"><span class="nav-link-icon">⚙️</span>設定</a>
  </div>
</nav>
<script>
(function(){
  window.navToggle = function() {
    var open = document.getElementById('navDrawer').classList.toggle('is-open');
    document.getElementById('hamBtn').classList.toggle('is-open', open);
    document.getElementById('navBackdrop').classList.toggle('is-open', open);
    document.getElementById('navDrawer').setAttribute('aria-hidden', String(!open));
  };
  window.navClose = function() {
    document.getElementById('navDrawer').classList.remove('is-open');
    document.getElementById('hamBtn').classList.remove('is-open');
    document.getElementById('navBackdrop').classList.remove('is-open');
    document.getElementById('navDrawer').setAttribute('aria-hidden', 'true');
  };
  (function(){
    var p = location.pathname;
    document.querySelectorAll('.nav-link[data-navpath]').forEach(function(el){
      el.classList.toggle('is-active', el.dataset.navpath === p);
    });
  })();
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') navClose(); });
  if (window.__SPA_INITIALIZED__) return;
  window.__SPA_INITIALIZED__ = true;
  window.SPA = {
    _esMap:{}, _logs:{research:[],discount:[],csv:[]}, _runningSet:new Set(),
    connect: function(t) {
      var ep=t==='research'?'/events/research':'/events';
      this._runningSet.add(t); this._logs[t]=[];
      if(this._esMap[t]){this._esMap[t].close();delete this._esMap[t];}
      var self=this, es=new EventSource(ep); this._esMap[t]=es;
      es.onmessage=function(e){
        if(e.data==='__DONE__'){self._runningSet.delete(t);document.dispatchEvent(new CustomEvent('spa:done',{detail:{taskType:t,ok:true}}));es.close();delete self._esMap[t];return;}
        self._logs[t].push(e.data);document.dispatchEvent(new CustomEvent('spa:log',{detail:{taskType:t,line:e.data}}));
      };
      es.onerror=function(){self._runningSet.delete(t);document.dispatchEvent(new CustomEvent('spa:done',{detail:{taskType:t,ok:false}}));es.close();delete self._esMap[t];};
    },
    isRunning:function(t){return this._runningSet.has(t);},
    isAnyRunning:function(){return this._runningSet.size>0;},
    getLines:function(t){return(this._logs[t]||[]).slice();},
    clearLog:function(t){this._logs[t]=[];}
  };
  document.addEventListener('click',function(e){
    var link=e.target.closest('a[data-navpath]'); if(!link)return;
    var href=link.getAttribute('href'); if(!href)return;
    e.preventDefault(); if(href===location.pathname){navClose();return;}
    _spaNavigate(href);
  });
  function _spaNavigate(href){
    if(typeof window.__spaIntercept==='function'&&window.__spaIntercept(href))return;
    fetch(href).then(function(r){return r.text();}).then(function(html){
      var doc=new DOMParser().parseFromString(html,'text/html');
      var nc=doc.getElementById('app-content'),cc=document.getElementById('app-content');
      if(!nc||!cc){location.href=href;return;}
      if(typeof window.__pageCleanup==='function'){window.__pageCleanup();window.__pageCleanup=null;}
      var newCss=Array.from(doc.head.querySelectorAll('style')).map(function(s){return s.textContent;}).join('\n');
      var ps=document.getElementById('page-style');
      if(ps){ps.textContent=newCss;}else{var ns=document.createElement('style');ns.id='page-style';ns.textContent=newCss;document.head.appendChild(ns);}
      cc.replaceWith(nc); history.pushState({},'',href); document.title=doc.title;
      document.querySelectorAll('.nav-link[data-navpath]').forEach(function(el){el.classList.toggle('is-active',el.dataset.navpath===href);});
      nc.querySelectorAll('script').forEach(function(s){var ns=document.createElement('script');ns.textContent=s.textContent;document.head.appendChild(ns);ns.remove();});
      navClose();
    }).catch(function(){location.href=href;});
  }
  window.addEventListener('popstate',function(){_spaNavigate(location.pathname);});
  // ── Global status bar ─────────────────────────────────────
  var _ssbEl=document.createElement('div'); _ssbEl.id='spa-status-bar';
  _ssbEl.innerHTML='<div class="ssb-row"><span class="ssb-dot"></span><span class="ssb-label">—</span><span class="ssb-line">—</span><button class="ssb-close" onclick="document.getElementById(\'spa-status-bar\').classList.remove(\'is-visible\')">✕</button></div><div class="ssb-track"><div class="ssb-fill"></div></div>';
  document.body.appendChild(_ssbEl);
  var _ssbSt=document.createElement('style');
  _ssbSt.textContent='#spa-status-bar{position:fixed;bottom:-90px;left:50%;transform:translateX(-50%);width:min(640px,calc(100vw - 32px));background:#1a1d27;border:1px solid #2e3250;border-radius:12px;padding:12px 16px 10px;box-shadow:0 8px 32px rgba(0,0,0,.6);z-index:1500;transition:bottom .3s cubic-bezier(.4,0,.2,1);pointer-events:none}#spa-status-bar.is-visible{bottom:16px;pointer-events:all}.ssb-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}.ssb-dot{width:8px;height:8px;border-radius:50%;background:#60a5fa;flex-shrink:0;animation:ssbPulse 1s infinite}#spa-status-bar.is-done .ssb-dot{background:#22c55e;animation:none}#spa-status-bar.is-error .ssb-dot{background:#ef4444;animation:none}@keyframes ssbPulse{0%,100%{opacity:1}50%{opacity:.3}}.ssb-label{font-size:12px;font-weight:700;color:#e2e8f0;flex-shrink:0}.ssb-line{font-size:11px;color:#64748b;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:"SF Mono","Menlo",monospace}.ssb-close{background:none;border:none;color:#64748b;cursor:pointer;font-size:14px;padding:0 2px;flex-shrink:0}.ssb-close:hover{color:#e2e8f0}.ssb-track{height:3px;background:#22263a;border-radius:999px;overflow:hidden}.ssb-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#60a5fa,#818cf8)}#spa-status-bar.is-done .ssb-fill{background:#22c55e}#spa-status-bar.is-error .ssb-fill{background:#ef4444}#spa-status-bar:not(.is-done):not(.is-error) .ssb-fill{width:40%;animation:ssbSlide 1.5s ease-in-out infinite}#spa-status-bar.is-done .ssb-fill,#spa-status-bar.is-error .ssb-fill{width:100%;transition:width .3s;animation:none}@keyframes ssbSlide{0%{margin-left:-40%}100%{margin-left:100%}}';
  document.head.appendChild(_ssbSt);
  var _ssbLbls={research:'売れ筋リサーチ中',discount:'値引き実行中',csv:'CSV更新中'};
  var _ssbBar=document.getElementById('spa-status-bar');
  document.addEventListener('spa:log',function(e){if(!e.detail||!_ssbBar)return;_ssbBar.querySelector('.ssb-label').textContent=_ssbLbls[e.detail.taskType]||e.detail.taskType;_ssbBar.querySelector('.ssb-line').textContent=e.detail.line;_ssbBar.classList.remove('is-done','is-error');_ssbBar.classList.add('is-visible');});
  document.addEventListener('spa:done',function(e){if(!e.detail||!_ssbBar)return;var label=_ssbLbls[e.detail.taskType]||e.detail.taskType;var msg=e.detail.ok?'処理が完了しました':'エラーが発生しました';_ssbBar.querySelector('.ssb-label').textContent=label;_ssbBar.querySelector('.ssb-line').textContent=msg;_ssbBar.classList.remove('is-done','is-error');_ssbBar.classList.add(e.detail.ok?'is-done':'is-error');setTimeout(function(){if(_ssbBar)_ssbBar.classList.remove('is-visible','is-done','is-error');},4000);_spaPlaySound(e.detail.ok);_spaNotify(label,msg,e.detail.ok);});
  function _spaPlaySound(ok){try{var ac=new(window.AudioContext||window.webkitAudioContext)();if(ok){[[660,0],[880,0.18]].forEach(function(p){var o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sine';o.frequency.value=p[0];g.gain.setValueAtTime(0.22,ac.currentTime+p[1]);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+p[1]+0.45);o.start(ac.currentTime+p[1]);o.stop(ac.currentTime+p[1]+0.45);});}else{var o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sine';o.frequency.value=320;g.gain.setValueAtTime(0.25,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.55);o.start(ac.currentTime);o.stop(ac.currentTime+0.55);}}catch(e){}}
  function _spaNotify(label,body,ok){if(!('Notification' in window))return;var title=label+(ok?' 完了 ✓':' エラー ✗');if(Notification.permission==='granted'){new Notification(title,{body:body,silent:true});}else if(Notification.permission!=='denied'){Notification.requestPermission().then(function(p){if(p==='granted')new Notification(title,{body:body,silent:true});});}}
  if('Notification' in window&&Notification.permission==='default'){Notification.requestPermission();}
})();
</script>
