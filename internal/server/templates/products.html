<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品一覧 — メルカリ自動値引きツール</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --surface2: #22263a;
      --border:   #2e3250;
      --accent:   #ff6b35;
      --green:    #22c55e;
      --yellow:   #f59e0b;
      --red:      #ef4444;
      --blue:     #60a5fa;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --console:  #0a0c14;
      --radius:   12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
                   "Noto Sans JP", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 80px;
    }

    /* ── Header ─────────────────────────────── */
    header {
      width: 100%; max-width: 960px;
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 36px;
    }
    .logo {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, #059669, #047857);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    header h1 { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
    header p  { font-size: 13px; color: var(--muted); margin-top: 2px; }

    /* ── Card ────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%; max-width: 960px;
      margin-bottom: 20px;
    }
    .card-title {
      font-size: 12px; font-weight: 600;
      color: var(--muted); text-transform: uppercase;
      letter-spacing: .08em; margin-bottom: 16px;
    }

    /* ── Action row ──────────────────────────── */
    .action-row {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .action-meta {
      display: flex; align-items: center; gap: 12px;
      margin-left: auto; flex-wrap: wrap;
    }

    /* ボタン共通 */
    .action-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 22px;
      color: #fff; border: none; border-radius: var(--radius);
      font-size: 15px; font-weight: 700; cursor: pointer;
      transition: opacity .2s, transform .1s;
      white-space: nowrap;
    }
    .action-btn:hover:not(:disabled) { opacity: .9; transform: translateY(-1px); }
    .action-btn:active:not(:disabled) { transform: translateY(0); }
    .action-btn:disabled {
      background: var(--surface2) !important; color: var(--muted);
      cursor: not-allowed; border: 1px solid var(--border);
    }
    .btn-csv     { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
    .btn-run     { background: linear-gradient(135deg, var(--accent), #ff3c7a); }

    .file-label {
      font-size: 12px; color: var(--muted);
      font-family: "SF Mono","Fira Code","Menlo",monospace;
    }
    .file-label span { color: var(--blue); }

    /* ── Status badge ────────────────────────── */
    .badge {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 14px; border-radius: 999px;
      font-size: 13px; font-weight: 600; border: 1px solid;
      white-space: nowrap;
    }
    .badge.idle { color: var(--green);  border-color: #16a34a44; background: #16a34a14; }
    .badge.busy { color: var(--yellow); border-color: #d97706aa; background: #d9770614; }
    .badge.done { color: var(--blue);   border-color: #3b82f644; background: #3b82f614; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .badge.busy .dot { animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── Progress console ────────────────────── */
    .progress-wrap { margin-top: 16px; display: none; }
    .progress-wrap.visible { display: block; }
    #progressConsole {
      background: var(--console); border: 1px solid var(--border);
      border-radius: 8px; padding: 14px; height: 200px;
      overflow-y: auto;
      font-family: "SF Mono","Fira Code","Menlo",monospace;
      font-size: 12px; line-height: 1.65;
      white-space: pre-wrap; word-break: break-all; color: #a0aec0;
    }
    #progressConsole .ln-ok    { color: #68d391; }
    #progressConsole .ln-err   { color: #fc8181; }
    #progressConsole .ln-info  { color: #90cdf4; }
    #progressConsole .ln-done  { color: #fbd38d; font-weight: 600; }
    #progressConsole .ln-start { color: var(--accent); font-weight: 600; }

    /* ── Table toolbar ───────────────────────── */
    .table-toolbar {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 12px; flex-wrap: wrap;
    }
    .table-toolbar-label {
      font-size: 12px; font-weight: 600;
      color: var(--muted); text-transform: uppercase;
      letter-spacing: .08em; margin-right: auto;
    }
    .ghost-btn {
      font-size: 12px; color: var(--muted); background: none;
      border: 1px solid var(--border); border-radius: 6px;
      padding: 5px 12px; cursor: pointer;
      transition: color .15s, border-color .15s;
      white-space: nowrap;
    }
    .ghost-btn:hover { color: var(--text); border-color: var(--muted); }

    /* ── Table ───────────────────────────────── */
    .table-wrap {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    table {
      width: 100%; border-collapse: collapse;
      font-size: 14px;
    }
    thead {
      background: var(--surface2);
      position: sticky; top: 0;
    }
    th {
      padding: 12px 16px;
      text-align: left; font-size: 11px; font-weight: 700;
      color: var(--muted); text-transform: uppercase; letter-spacing: .07em;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th.right { text-align: right; }
    th.center { text-align: center; }
    td {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text); line-height: 1.4;
    }
    td.price {
      text-align: right; font-family: "SF Mono","Menlo",monospace;
      font-weight: 600; color: var(--yellow); white-space: nowrap;
    }
    td.img-cell { width: 56px; padding: 8px 12px; }
    td.exclude-cell { width: 64px; text-align: center; padding: 8px 16px; }

    .thumb {
      width: 40px; height: 40px;
      object-fit: cover; border-radius: 6px; display: block;
    }
    .no-img {
      display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px;
      background: var(--surface2); border-radius: 6px;
      font-size: 18px; opacity: .45;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }

    /* 対象外チェックされた行を薄く表示 */
    tr.excluded td { opacity: .4; }
    tr.excluded td.exclude-cell { opacity: 1; }

    /* チェックボックス */
    .exclude-cb {
      width: 16px; height: 16px;
      accent-color: var(--red);
      cursor: pointer;
    }

    .table-empty {
      text-align: center; padding: 48px 16px;
      color: var(--muted); font-size: 14px;
    }
    .table-empty .empty-icon { font-size: 36px; display: block; margin-bottom: 12px; opacity: .5; }

    /* ── Summary row ─────────────────────────── */
    .summary {
      font-size: 12px; color: var(--muted); margin-top: 12px;
      display: flex; justify-content: flex-end; gap: 16px;
    }
    .summary-excluded { color: var(--red); }

    /* Scrollbars */
    #progressConsole::-webkit-scrollbar { width: 5px; }
    #progressConsole::-webkit-scrollbar-track { background: transparent; }
    #progressConsole::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    footer {
      margin-top: 16px; font-size: 12px;
      color: var(--muted); text-align: center;
    }

    /* ── Progress widget ────────────────────────────── */
    .progress-widget {
      padding: 16px 0 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .progress-bar-track {
      width: 100%; height: 7px;
      background: var(--surface2); border-radius: 999px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; border-radius: 999px;
      background: linear-gradient(90deg, var(--blue), #8b5cf6);
      width: 0%;
      transition: width .65s cubic-bezier(.4,0,.2,1);
    }
    .progress-bar-fill.is-done  { background: linear-gradient(90deg, #059669, var(--green)); }
    .progress-bar-fill.is-error { background: var(--red); width: 100% !important; }
    .progress-info-row {
      display: flex; align-items: center; gap: 10px;
      margin-top: 8px;
    }
    .progress-step-lbl {
      font-size: 12px; color: var(--muted); flex: 1;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .progress-pct-lbl {
      font-size: 12px; font-weight: 700;
      font-family: "SF Mono","Menlo",monospace;
      color: var(--blue); flex-shrink: 0;
      transition: color .3s;
    }
    .progress-pct-lbl.is-done  { color: var(--green); }
    .progress-pct-lbl.is-error { color: var(--red); }
    .progress-count-row {
      margin-top: 5px;
      font-size: 11px; font-weight: 700;
      font-family: "SF Mono","Menlo",monospace;
      color: var(--yellow); letter-spacing: .02em;
    }

    /* ── Nav Drawer ──────────────────────────────────── */
    .ham-btn {
      position: fixed; top: 16px; right: 16px; z-index: 1000;
      width: 42px; height: 42px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 5px;
      transition: border-color .15s, background .15s;
    }
    .ham-btn:hover { border-color: var(--accent); background: var(--surface); }
    .ham-line {
      width: 18px; height: 2px;
      background: var(--text); border-radius: 2px;
      transition: transform .25s ease, opacity .2s ease;
    }
    .ham-btn.is-open .ham-line:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .ham-btn.is-open .ham-line:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .ham-btn.is-open .ham-line:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .nav-backdrop {
      position: fixed; inset: 0; z-index: 900;
      background: rgba(0,0,0,.55); backdrop-filter: blur(3px);
      opacity: 0; pointer-events: none; transition: opacity .25s ease;
    }
    .nav-backdrop.is-open { opacity: 1; pointer-events: all; }
    .nav-drawer {
      position: fixed; top: 0; right: -270px; bottom: 0; z-index: 950;
      width: 260px; background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column; padding-top: 16px;
      transition: right .28s cubic-bezier(.4,0,.2,1); overflow-y: auto;
    }
    .nav-drawer.is-open { right: 0; }
    .nav-drawer-head {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 18px 18px; border-bottom: 1px solid var(--border);
    }
    .nav-drawer-logo {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--accent), #ff3c7a);
      border-radius: 8px; display: flex; align-items: center;
      justify-content: center; font-size: 17px; flex-shrink: 0;
    }
    .nav-drawer-title { font-size: 13px; font-weight: 700; color: var(--text); }
    .nav-drawer-sub   { font-size: 11px; color: var(--muted); }
    .nav-links { padding: 10px 0; flex: 1; }
    .nav-link {
      display: flex; align-items: center; gap: 11px;
      padding: 11px 18px; text-decoration: none; color: var(--muted);
      font-size: 14px; font-weight: 500;
      border-left: 3px solid transparent;
      transition: color .15s, background .15s, border-color .15s;
    }
    .nav-link:hover { color: var(--text); background: var(--surface2); }
    .nav-link.is-active {
      color: var(--text); background: rgba(255,107,53,.08);
      border-left-color: var(--accent); font-weight: 600;
    }
    .nav-link-icon { font-size: 17px; flex-shrink: 0; width: 22px; text-align: center; }
    .nav-sep { height: 1px; background: var(--border); margin: 8px 18px; }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">📋</div>
  <div>
    <h1>商品一覧</h1>
    <p>CSV作成・値引き実行・対象外設定</p>
  </div>
</header>

<!-- 操作カード -->
<div class="card">
  <div class="card-title">操作</div>
  <div class="action-row">
    <button class="action-btn btn-csv" id="csvBtn" onclick="updateCSV()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      CSV を更新する
    </button>
    <button class="action-btn btn-run" id="runBtn" onclick="runDiscount()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="5 3 19 12 5 21 5 3"/>
      </svg>
      値引きを実行する
    </button>
    <div class="action-meta">
      <div id="statusBadge" class="badge idle">
        <span class="dot"></span>
        <span id="statusText">待機中</span>
      </div>
      <div class="file-label">読込ファイル: <span id="fileLabel">—</span></div>
    </div>
  </div>
  <div class="progress-wrap" id="progressWrap">
    <!-- プログレスバー -->
    <div class="progress-widget" id="progressWidget">
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="progress-info-row">
        <span class="progress-step-lbl" id="progressStep">準備中…</span>
        <span class="progress-pct-lbl"  id="progressPct">0%</span>
      </div>
      <div class="progress-count-row" id="progressCount" style="display:none"></div>
    </div>
    <!-- ログコンソール -->
    <div id="progressConsole"></div>
  </div>
</div>

<!-- 商品一覧テーブル -->
<div class="card">
  <div class="table-toolbar">
    <span class="table-toolbar-label">商品一覧</span>
    <button class="ghost-btn" onclick="selectAllExclude(false)">全選択解除</button>
    <button class="ghost-btn" onclick="selectAllExclude(true)">全て対象外</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>画像</th>
          <th>商品名</th>
          <th class="right">価格（円）</th>
          <th class="center" title="チェックすると値引き対象外になります">対象外</th>
        </tr>
      </thead>
      <tbody id="productBody">
        <tr><td colspan="5" class="table-empty">
          <span class="empty-icon">📦</span>
          読み込み中…
        </td></tr>
      </tbody>
    </table>
  </div>
  <div class="summary" id="summary"></div>
</div>

<footer>Mercari Auto Price Down Tool — ローカル管理UI</footer>

<script>
  const csvBtn       = document.getElementById('csvBtn');
  const runBtn       = document.getElementById('runBtn');
  const statusBadge  = document.getElementById('statusBadge');
  const statusText   = document.getElementById('statusText');
  const fileLabel    = document.getElementById('fileLabel');
  const productBody  = document.getElementById('productBody');
  const summary      = document.getElementById('summary');
  const progressWrap = document.getElementById('progressWrap');
  const progressEl   = document.getElementById('progressConsole');

  let isRunning    = false;
  let es           = null;
  let currentItems = [];
  const excludedIds = new Set();   // 対象外チェック済みの商品ID

  // ── 進捗管理 ─────────────────────────────────────
  let currentMode        = 'csv';    // 'csv' | 'discount'
  let totalDiscountItems = 0;

  function resetProgress() {
    document.getElementById('progressFill').style.width = '0%';
    document.getElementById('progressFill').className   = 'progress-bar-fill';
    document.getElementById('progressStep').textContent = '準備中…';
    const pctEl = document.getElementById('progressPct');
    pctEl.textContent = '0%';
    pctEl.className   = 'progress-pct-lbl';
    document.getElementById('progressCount').style.display = 'none';
    totalDiscountItems = 0;
  }

  function setProgressBar(pct, stepText, countText) {
    const fill  = document.getElementById('progressFill');
    const step  = document.getElementById('progressStep');
    const pctEl = document.getElementById('progressPct');
    const count = document.getElementById('progressCount');
    const p = Math.max(0, Math.min(100, pct));
    fill.style.width  = p + '%';
    step.textContent  = stepText;
    pctEl.textContent = p + '%';
    if (pct >= 100) {
      fill.classList.add('is-done');
      pctEl.classList.add('is-done');
    } else if (pct < 0) {
      fill.classList.add('is-error');
      pctEl.classList.add('is-error');
      pctEl.textContent = '—';
    }
    if (typeof countText === 'string') {
      count.style.display = 'block';
      count.textContent   = countText;
    } else if (countText === null) {
      count.style.display = 'none';
    }
  }

  // ログ1行から進捗情報を解析して返す
  function parseProgress(line) {
    const csv = currentMode === 'csv';

    // ── Chrome 起動フェーズ ──────────────────────────
    if (/Chrome起動 → 開始|Chrome接続確認/.test(line))
      return { pct: csv ? 8 : 6,  step: 'Chrome 起動中…' };
    if (line.includes('Chromeプロセス開始'))
      return { pct: csv ? 13 : 9, step: 'Chrome プロセス起動完了' };
    if (line.includes('Chrome DevTools接続準備') && line.includes('完了'))
      return { pct: csv ? 18 : 13, step: 'DevTools 接続完了' };
    if (line.includes('タブID取得') && !line.includes('見つかりません'))
      return { pct: csv ? 22 : 16, step: 'ブラウザタブ 接続完了' };

    // ── ナビゲーション ───────────────────────────────
    if (line.includes('メルカリTOP') && line.includes('200 OK'))
      return { pct: csv ? 32 : 22, step: 'メルカリ TOP 読み込み完了' };
    if (line.includes('商品ID抽出')) {
      const m = line.match(/→ (\d+)件/);
      const n = m ? m[1] : '';
      if (!csv && n) totalDiscountItems = parseInt(n);
      return { pct: csv ? 48 : 30, step: `出品商品 ${n ? n+'件 ' : ''}取得完了` };
    }
    if (line.includes('ログイン済み'))
      return { pct: csv ? 55 : 35, step: 'ログイン確認完了' };

    if (csv) {
      // ── CSV モード ────────────────────────────────
      if (line.includes('スナップショット記録') && line.includes('CSV作成モード'))
        return { pct: 62, step: '商品情報 取得中…' };
      if (line.includes('出品一覧(価格CSV)') && line.includes('商品数取得')) {
        const m = line.match(/→ (\d+)件/);
        return { pct: 74, step: `商品データ ${m ? m[1]+'件 ' : ''}収集中` };
      }
      if (line.includes('画像ロード待機') && line.includes('完了'))
        return { pct: 86, step: '画像 読み込み完了' };
      if (line.includes('CSV保存完了'))
        return { pct: 94, step: 'CSV ファイル保存完了' };

    } else {
      // ── 値引きモード ──────────────────────────────
      if (line.includes('スナップショット記録') && line.includes('値引き前'))
        return { pct: 38, step: '値引き前 スナップショット記録中' };
      if (line.includes('一括値引き') && line.includes('開始')) {
        const m = line.match(/開始 \((\d+)件/);
        if (m) totalDiscountItems = parseInt(m[1]);
        return { pct: 42, step: `値引き処理 開始 (${totalDiscountItems}件)` };
      }
      const itemM = line.match(/\((\d+)\/(\d+)\) 画面遷移/);
      if (itemM) {
        const cur   = parseInt(itemM[1]);
        const total = parseInt(itemM[2]);
        if (total > 0) totalDiscountItems = total;
        const pct = 42 + Math.round((cur - 1) / (totalDiscountItems || 1) * 38);
        return {
          pct,
          step:  `値引き処理中  ${cur} / ${totalDiscountItems} 件`,
          count: `▶ ${cur} / ${totalDiscountItems} 件処理中`
        };
      }
      if (line.includes('スナップショット記録') && line.includes('値引き後'))
        return { pct: 83, step: '値引き後 スナップショット記録中', count: null };
      if (line.includes('CSV保存完了'))
        return { pct: 93, step: 'CSV ファイル保存完了', count: null };
    }

    // ── 完了 / エラー ─────────────────────────────
    if (line.includes('全処理完了') || line.includes('[終了] 正常終了'))
      return { pct: 100, step: 'すべての処理が完了しました', count: null };
    if (/\[終了\] エラー/.test(line))
      return { pct: -1, step: 'エラーが発生しました', count: null };

    return null;
  }

  // ── CSV データ読み込み ──────────────────────────
  async function loadProducts() {
    try {
      const res  = await fetch('/csv-data');
      const data = await res.json();
      currentItems = data.items || [];
      renderTable(currentItems, data.file || '');
    } catch (err) {
      productBody.innerHTML = `<tr><td colspan="5" class="table-empty">
        <span class="empty-icon">⚠️</span>
        エラー: ${escHtml(err.message)}
      </td></tr>`;
    }
  }

  function renderTable(items, file) {
    fileLabel.textContent = file || '（CSVなし）';

    if (!items || items.length === 0) {
      productBody.innerHTML = `<tr><td colspan="5" class="table-empty">
        <span class="empty-icon">📦</span>
        商品データがありません。「CSV を更新する」を押して取得してください。
      </td></tr>`;
      summary.innerHTML = '';
      return;
    }

    productBody.innerHTML = items.map((item, i) => {
      const excluded = excludedIds.has(item.id);
      return `
      <tr class="${excluded ? 'excluded' : ''}" data-id="${escHtml(item.id)}">
        <td style="color:var(--muted);font-size:12px">${i + 1}</td>
        <td class="img-cell">
          ${item.imagePath
            ? `<img src="${item.imagePath}" class="thumb" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'no-img',textContent:'📷'}))">`
            : `<span class="no-img">📷</span>`}
        </td>
        <td>${escHtml(item.name)}</td>
        <td class="price">¥${Number(item.price).toLocaleString('ja-JP')}</td>
        <td class="exclude-cell">
          <input type="checkbox" class="exclude-cb" data-id="${escHtml(item.id)}"
                 ${excluded ? 'checked' : ''}
                 title="チェックすると値引き対象外になります">
        </td>
      </tr>`;
    }).join('');

    // チェックボックスのイベント登録
    productBody.querySelectorAll('.exclude-cb').forEach(cb => {
      cb.addEventListener('change', onExcludeChange);
    });

    updateSummary(items.length);
  }

  function onExcludeChange(e) {
    const id  = e.target.dataset.id;
    const row = e.target.closest('tr');
    if (e.target.checked) {
      excludedIds.add(id);
      row.classList.add('excluded');
    } else {
      excludedIds.delete(id);
      row.classList.remove('excluded');
    }
    updateSummary(currentItems.length);
  }

  function updateSummary(total) {
    const excCount = excludedIds.size;
    const targetCount = total - excCount;
    let html = `<span>${total} 件</span>`;
    if (excCount > 0) {
      html += `<span class="summary-excluded">対象外: ${excCount} 件</span>`;
      html += `<span>値引き対象: ${targetCount} 件</span>`;
    }
    summary.innerHTML = html;
  }

  function selectAllExclude(check) {
    currentItems.forEach(item => {
      if (check) {
        excludedIds.add(item.id);
      } else {
        excludedIds.delete(item.id);
      }
    });
    renderTable(currentItems, fileLabel.textContent);
  }

  // ── CSV 更新 ──────────────────────────────────
  async function updateCSV() {
    if (isRunning) return;
    currentMode = 'csv';
    resetProgress();

    setRunning(true, 'CSV更新中…');
    progressWrap.classList.add('visible');
    progressEl.innerHTML = '';

    try {
      const res  = await fetch('/create-csv', { method: 'POST' });
      const data = await res.json();
      if (res.status === 409) {
        appendProgress('⚠ すでに実行中です');
        setRunning(false);
        return;
      }
      if (!res.ok) {
        appendProgress('ERROR: ' + (data.error || res.statusText));
        setRunning(false);
        return;
      }
    } catch (err) {
      appendProgress('ERROR: ' + err.message);
      setRunning(false);
      return;
    }

    connectSSE(() => { loadProducts(); });
  }

  // ── 値引き実行 ─────────────────────────────────
  async function runDiscount() {
    if (isRunning) return;
    currentMode = 'discount';
    totalDiscountItems = 0;
    resetProgress();

    const excluded = Array.from(excludedIds);

    setRunning(true, '値引き実行中…');
    progressWrap.classList.add('visible');
    progressEl.innerHTML = '';

    if (excluded.length > 0) {
      appendProgress(`[対象外] ${excluded.length} 件をスキップします`);
    }

    try {
      const res = await fetch('/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ excludedIds: excluded }),
      });
      const data = await res.json();
      if (res.status === 409) {
        appendProgress('⚠ すでに実行中です');
        setRunning(false);
        return;
      }
      if (!res.ok) {
        appendProgress('ERROR: ' + (data.error || res.statusText));
        setRunning(false);
        return;
      }
    } catch (err) {
      appendProgress('ERROR: ' + err.message);
      setRunning(false);
      return;
    }

    connectSSE(() => { loadProducts(); });
  }

  // ── SSE ──────────────────────────────────────────
  function connectSSE(onDone) {
    if (es) { es.close(); }
    es = new EventSource('/events');
    es.onmessage = (e) => {
      if (e.data === '__DONE__') {
        es.close();
        es = null;
        setProgressBar(100, 'すべての処理が完了しました', null);
        setRunning(false);
        if (onDone) onDone();
        return;
      }
      appendProgress(e.data);
    };
    es.onerror = () => {
      es.close();
      es = null;
      setRunning(false);
    };
  }

  // ── 状態管理 ─────────────────────────────────────
  function setRunning(running, label) {
    isRunning = running;
    csvBtn.disabled = running;
    runBtn.disabled = running;
    if (running) {
      statusBadge.className = 'badge busy';
      statusText.textContent = label || '実行中…';
    } else {
      statusBadge.className = 'badge idle';
      statusText.textContent = '待機中';
    }
  }

  // ── プログレスコンソール ──────────────────────────
  function appendProgress(text) {
    // プログレスバー更新
    const prog = parseProgress(text);
    if (prog) setProgressBar(prog.pct, prog.step, prog.count);

    // ログ表示
    const d = document.createElement('div');
    d.className = lineClass(text);
    d.textContent = text;
    progressEl.appendChild(d);
    progressEl.scrollTop = progressEl.scrollHeight;
  }

  function lineClass(t) {
    const l = t.toLowerCase();
    if (t.startsWith('[終了]'))  return 'ln-done';
    if (t.startsWith('[起動]'))  return 'ln-start';
    if (l.includes('error') || l.includes('エラー')) return 'ln-err';
    if (l.includes('成功') || l.includes('完了') || l.includes('ok')) return 'ln-ok';
    if (t.startsWith('['))       return 'ln-info';
    return '';
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── 初期化 ───────────────────────────────────────
  loadProducts();
</script>

<script>
  (function() {
    const p = location.pathname;
    document.querySelectorAll('.nav-link[data-navpath]').forEach(el => {
      if (el.dataset.navpath === p) el.classList.add('is-active');
    });
  })();
  function navToggle() {
    const open = document.getElementById('navDrawer').classList.toggle('is-open');
    document.getElementById('hamBtn').classList.toggle('is-open', open);
    document.getElementById('navBackdrop').classList.toggle('is-open', open);
    document.getElementById('navDrawer').setAttribute('aria-hidden', !open);
  }
  function navClose() {
    document.getElementById('navDrawer').classList.remove('is-open');
    document.getElementById('hamBtn').classList.remove('is-open');
    document.getElementById('navBackdrop').classList.remove('is-open');
    document.getElementById('navDrawer').setAttribute('aria-hidden', 'true');
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') navClose(); });
</script>
